server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: analytics-service
          uri: http://localhost:8083
          predicates:
            - Path=/analytics-service/**
          filters:
            - StripPrefix=1
        - id: auth-service
          uri: http://localhost:8084
          predicates:
            - Path=/auth-service/**
          filters:
            - StripPrefix=1
        - id: notification-service
          uri: http://localhost:8082
          predicates:
            - Path=/notification-service/**
          filters:
            - StripPrefix=1
        - id: task-service
          uri: http://localhost:8081
          predicates:
            - Path=/task-service/**
          filters:
            - StripPrefix=1


eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true



management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics  # ??? Actuator
  endpoint:
    health:
      show-details: always
